# 署名なしのiPhone用アプリ(.ipa)をGitHubのMacで作る。署名はWindowsのSideloadlyで行う。
name: Build unsigned IPA

on:
  workflow_dispatch:      # GitHubの「Actions」画面から手動で実行
  push:
    branches: [main]

jobs:
  build:
    # Apple Silicon(arm64)のMacが混み合って始まらないことがあるため、Intel の Mac を使う(iPhone用アプリは、どちらのMacでも作れる)
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version

      - name: Install JS dependencies
        run: npm ci

      - name: Write build info (shown in the app diagnostics screen)
        run: |
          printf "export const BUILD_AT = '%s';\nexport const BUILD_SHA = '%s';\n" "$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')" "$GITHUB_SHA" > src/buildinfo.ts
          cat src/buildinfo.ts

      - name: Generate iOS project (expo prebuild)
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/app.xcworkspace \
            -scheme app \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -n 20

      - name: Show errors (only when the build failed)
        if: failure()
        run: |
          echo "===== error lines ====="
          grep -n -E "error:|error: |fatal error|Command PhaseScriptExecution failed|\*\* BUILD FAILED" build.log | head -60 || true
          echo "===== ExpoModulesJSI part ====="
          grep -n -B2 -A40 "Build ExpoModulesJSI xcframework" build.log | grep -v "^--$" | head -150 || true

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Package .ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "app = $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry plant-client.ipa Payload
          ls -lh plant-client.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: plant-client-ipa
          path: plant-client.ipa
          retention-days: 14
